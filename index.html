        let sedangUjian = false;
        let namaSiswaAktif = "";

        function muatSoal() {
            const container = document.getElementById("questionsList");
            container.innerHTML = "";

            bankSoal.forEach((item, index) => {
                const qDiv = document.createElement("div");
                qDiv.className = "question-card";

                let pilihanHTML = "";
                item.pilihan.forEach((pil, pilIndex) => {
                    const kodePilihan = String.fromCharCode(65 + pilIndex);
                    pilihanHTML += `
                        <label>
                            <input type="radio" name="q${item.id}" value="${kodePilihan}">
                            <span>${pil}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <div class="question-title"><b>${index + 1}.</b> ${item.soal}</div>
                    <div class="options-group">${pilihanHTML}</div>
                `;
                container.appendChild(qDiv);
            });
        }

        function mulaiUjian() {
            const nama = document.getElementById("namaSiswa").value.trim();
            const tokenInput = document.getElementById("tokenMasuk").value.trim();

            if (!nama) {
                alert("Harap isi Nama Lengkap terlebih dahulu!");
                return;
            }
            if (tokenInput !== TOKEN_MASUK_VALID) {
                alert("Token Ujian Salah!");
                return;
            }

            namaSiswaAktif = nama;
            document.getElementById("displayNama").innerText = "Siswa: " + nama;
            
            muatSoal();

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("examContainer").style.display = "block";
            
            sedangUjian = true;
        }

        function selesaiUjian() {
            if (!confirm("Apakah Anda yakin ingin menyelesaikan ujian?")) return;

            document.getElementById("btnKirim").disabled = true;
            document.getElementById("btnKirim").innerText = "Memproses...";

            let benar = 0;
            bankSoal.forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected && selected.value === q.kunci) {
                    benar++;
                }
            });

            const totalSoal = bankSoal.length;
            const nilaiAkhir = Math.round((benar / totalSoal) * 100);

            sedangUjian = false; // Matikan deteksi kuncian
            
            document.getElementById("examContainer").style.display = "none";
            document.getElementById("resultContainer").style.display = "block";
            document.getElementById("scoreDisplay").innerText = nilaiAkhir;
            document.getElementById("studentInfo").innerText = `Nama: ${namaSiswaAktif} | Benar: ${benar} dari ${totalSoal} Soal`;

            // Kirim Data ke Google Sheets
            kirimKeGoogleSheets(namaSiswaAktif, benar, totalSoal, nilaiAkhir);
        }

        function kirimKeGoogleSheets(nama, benar, totalSoal, nilai) {
            const statusElement = document.getElementById("statusPengiriman");

            if (!SCRIPT_URL || SCRIPT_URL === "TEMPEL_URL_APPS_SCRIPT_ANDA_DI_SINI") {
                statusElement.innerText = "Selesai (URL Apps Script belum dikonfigurasi).";
                return;
            }

            const payload = {
                nama: nama,
                benar: benar,
                totalSoal: totalSoal,
                nilai: nilai
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusElement.innerText = "✓ Nilai berhasil direkap ke Google Sheets!";
                statusElement.style.color = "#0f9d58";
            })
            .catch(error => {
                console.error("Gagal mengirim:", error);
                statusElement.innerText = "× Gagal mengirim ke Google Sheets. Hubungi pengawas.";
                statusElement.style.color = "#d93025";
            });
        }

        // --- SISTEM DETEKSI PELANGGARAN ---
        document.addEventListener("visibilitychange", function() {
            if (document.hidden && sedangUjian) {
                kunciLayar();
            }
        });

        function kunciLayar() {
            document.getElementById("lockOverlay").style.display = "flex";
        }

        function bukaKunci() {
            const inputPIN = document.getElementById("pinPengawasInput").value;

            if (inputPIN === PIN_PENGAWAS) {
                document.getElementById("lockOverlay").style.display = "none";
                document.getElementById("pinPengawasInput").value = "";
                alert("Kuncian berhasil dibuka. Silakan lanjutkan ujian.");
            } else {
                alert("PIN Pengawas Salah!");
                document.getElementById("pinPengawasInput").value = "";
            }
        }
    </script>
